<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultilizando Css interno na pagina</title>
    <!-- Css interno(Sempre fica no head da pagina) -->
    <style>
        /* adicionando css a tag p */
        p{
            color: red;
            font-size: 23px;
        }
        h1{
            background-color: blue;
        }  
        s{
            font-size: 25px;
        } 
    </style>
</head>
<body>
    <p>Css interno da pagina</p>
    <p>teste</p>
    <s>qualquer coisa</s>
</body>
</html>
